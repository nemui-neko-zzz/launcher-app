<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="apple-touch-icon" href="icons/launcher.png">
<title>アプリ一覧</title>
<!--
  launcher-app: 自分のアプリへのリンク集。
  ・アプリを足すときは、下の APPS に1行足す + icons/ に画像を置くだけ。
  ・Safariで開く前提(全画面アプリ指定は付けていないので、戻るボタンが使える)。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#8e8e93; --line:rgba(60,60,67,.18); --press:#e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --card:#1c1c1e; --text:#ffffff; --muted:#8e8e93; --line:rgba(84,84,88,.6); --press:#2c2c2e; }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 32px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
  h1 { font-size: 32px; font-weight: 800; margin: 0 4px 20px; letter-spacing: .5px; }
  .group-label { font-size: 13px; color: var(--muted); margin: 24px 16px 6px; }
  .group { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; color: inherit; text-decoration: none; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; border-top: 0.5px solid var(--line); }
  .row:active { background: var(--press); }
  .icon { width: 42px; height: 42px; border-radius: 22.37%; flex-shrink: 0; display: block; }
  .text { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 600; }
  .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chev { color: var(--muted); opacity: .7; flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>アプリ</h1>
  <div id="lists"></div>
</div>

<script>
// ===== ここに足すだけ =====
// group: 見出し(同じ名前の行がまとまる) / name: 表示名 / desc: ひとこと / url: 公開URL / icon: icons/ の画像
// 「やること」は1つのアプリで2タブ。?tab= で開くタブを指定する(見出しは文字だけ、アイコンは同じものを2つ並べる)
const BASE = "https://nemui-neko-zzz.github.io/";
const APPS = [
  { group: "やること", name: "そろそろ",   desc: "くり返しの周期を予測",           url: BASE + "task-cadence-app/?tab=cycle", icon: "icons/task-cadence.png" },
  { group: "やること", name: "とりあえず", desc: "やることを消化してレベルアップ", url: BASE + "task-cadence-app/?tab=motiv", icon: "icons/task-cadence.png" },
  { group: "ほかのアプリ", name: "レシート",     desc: "レシートの記録と推移",             url: BASE + "receipt-app/",          icon: "icons/receipt.png" },
  { group: "ほかのアプリ", name: "outfit log",   desc: "服の写真と天気の記録",             url: BASE + "outfit-log/",           icon: "icons/outfit.png" },
  { group: "ほかのアプリ", name: "ふむふむ",     desc: "言葉を調べる(コトバンク / アルク)", url: BASE + "dictionary-app/",       icon: "icons/dictionary.png" },
  { group: "ほかのアプリ", name: "よしなしおと", desc: "ふと浮かんだ音を、ひとつずつ",     url: BASE + "earworm-app/",          icon: "icons/earworm.png" },
  { group: "ほかのアプリ", name: "匿名化ツール", desc: "文章の個人情報を伏せ字にする",     url: BASE + "local-anonymizer-app/", icon: "icons/anonymizer.png" },
];

const CHEV = '<svg class="chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l6 6-6 6"/></svg>';
const root = document.getElementById("lists");
const groups = [];
APPS.forEach(a => { if (!groups.includes(a.group)) groups.push(a.group); });
groups.forEach(g => {
  const label = document.createElement("div");
  label.className = "group-label"; label.textContent = g;
  const box = document.createElement("div");
  box.className = "group";
  APPS.filter(a => a.group === g).forEach(a => {
    const row = document.createElement("a");
    row.className = "row"; row.href = a.url;
    const icon = document.createElement("img");
    icon.className = "icon"; icon.src = a.icon; icon.alt = ""; icon.width = 42; icon.height = 42;
    const text = document.createElement("div");
    text.className = "text";
    const name = document.createElement("div"); name.className = "name"; name.textContent = a.name;
    const desc = document.createElement("div"); desc.className = "desc"; desc.textContent = a.desc;
    text.append(name, desc);
    row.append(icon, text);
    row.insertAdjacentHTML("beforeend", CHEV);
    box.appendChild(row);
  });
  root.append(label, box);
});
</script>
</body>
</html>
